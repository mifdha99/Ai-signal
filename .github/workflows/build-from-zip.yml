name: Build UniversalSignalAI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          curl -fL \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o "$RUNNER_TEMP/gradle-8.9-bin.zip"

          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" \
            -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle
        run: gradle --version

      - name: Extract project if ZIP exists
        run: |
          if [ -f "UniversalSignalAI-Android-Project.zip" ]; then
            mkdir -p extracted
            unzip -q UniversalSignalAI-Android-Project.zip -d extracted
          else
            mkdir -p extracted/UniversalSignalAI
            cp -r app build.gradle.kts settings.gradle.kts gradle.properties extracted/UniversalSignalAI/
          fi

      - name: Run Unit Tests
        working-directory: extracted/UniversalSignalAI
        run: |
          gradle --no-daemon testDebugUnitTest

      - name: Build Debug APK
        working-directory: extracted/UniversalSignalAI
        run: |
          gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK="extracted/UniversalSignalAI/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            find extracted/UniversalSignalAI/app/build/outputs -type f || true
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalSignalAI-Android-APK
          path: extracted/UniversalSignalAI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
